<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Verify Email')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Shared Navigation -->
<nav th:replace="~{fragments :: navbar}"></nav>

<!-- Main Content -->
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-5 bg-white border border-light shadow-lg">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fs-2 mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-envelope-check-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Verify Your Email</h2>
                        <p class="text-muted">We sent a 6-digit verification code to <strong th:text="${email}"></strong>. Enter it below.</p>
                    </div>

                    <!-- Alert Messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4 animate-fade-in" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Verify Form -->
                    <form th:action="@{/verify}" method="post">
                        <input type="hidden" name="email" th:value="${email}" />
                        
                        <div class="mb-4">
                            <label for="otp" class="form-label">Verification Code</label>
                            <input type="text" class="form-control form-control-lg text-center letter-spacing-2" id="otp" name="otp" 
                                   placeholder="123456" required autofocus maxlength="6">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 rounded-pill py-3 fw-bold shadow-sm">
                            Verify Account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments :: footer}"></footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
